# Редирект всего HTTP-трафика на HTTPS
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

# Основной сервер на HTTPS
server {
    listen 443 ssl;
    server_name _;

    # Пути к вашим SSL-сертификатам внутри контейнера
    # (они берутся из папки ./certs на хосте)
    ssl_certificate /etc/nginx/certs/fullchain.pem;     # Замените имя файла, если оно другое
    ssl_certificate_key /etc/nginx/certs/privkey.pem; # Замените имя файла, если оно другое

    # Безопасные протоколы и шифры
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Логирование
    access_log /var/log/nginx/access.log;
    access_log /dev/stdout;

    location / {
        proxy_pass http://web:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme; # Важно для передачи схемы https бэкенду
    }
}
